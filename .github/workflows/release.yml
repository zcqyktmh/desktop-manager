name: Build Windows installer

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-2025
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Publish self-contained Windows app
        shell: pwsh
        run: dotnet publish .\src\DesktopManager\DesktopManager.csproj -c Release -r win-x64 --self-contained true -p:DebugType=None -p:DebugSymbols=false -o .\artifacts\publish

      - name: Install Inno Setup 6
        shell: pwsh
        run: |
          winget install --id JRSoftware.InnoSetup -e --version 6.7.3 --silent --accept-package-agreements --accept-source-agreements
          if ($LASTEXITCODE -ne 0) { throw "winget failed to install Inno Setup: $LASTEXITCODE" }

      - name: Build installer
        shell: pwsh
        run: |
          $version = if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME.TrimStart('v') } else { '0.0.0' }
          $iscc = (Get-Command 'ISCC.exe' -ErrorAction SilentlyContinue).Source
          if (-not $iscc) {
            $installRoots = @('C:\Program Files (x86)\Inno Setup 6', 'C:\Program Files\Inno Setup 6', "$env:LOCALAPPDATA\Programs\Inno Setup 6") | Where-Object { Test-Path -LiteralPath $_ }
            $iscc = Get-ChildItem $installRoots -Filter 'ISCC.exe' -Recurse | Select-Object -First 1 -ExpandProperty FullName
          }
          if (-not $iscc) { throw 'Inno Setup compiler was not found on the Windows runner.' }
          & $iscc "/DMyAppVersion=$version" '.\installer\DesktopManager.iss'
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup exited with code $LASTEXITCODE" }

      - name: Create GitHub release and attach installer
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          gh release create $tag '.\artifacts\DesktopManager-Setup.exe' --title "桌面管家 $tag" --generate-notes

      - name: Upload installer artifact
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: DesktopManager-Windows-Setup
          path: artifacts/DesktopManager-Setup.exe
